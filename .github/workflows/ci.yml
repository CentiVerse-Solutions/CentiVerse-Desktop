name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # §9.2 order: typecheck -> lint -> test -> build.
      # api/e2e stages join this workflow in Phase 3 and Phase 5.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # §4.5: packages/core is held at 100% branch coverage.
      - run: pnpm test:cov
      - run: pnpm build
